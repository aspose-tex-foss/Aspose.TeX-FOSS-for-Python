[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aspose-tex-foss"
version = "26.11.1"
description = "Pure-Python TeX/LaTeX processing library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-FONTS"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/aspose-tex-foss/Aspose.TeX-FOSS-for-Python"
Source = "https://github.com/aspose-tex-foss/Aspose.TeX-FOSS-for-Python"
Issues = "https://github.com/aspose-tex-foss/Aspose.TeX-FOSS-for-Python/issues"

[project.scripts]
aspose-tex = "aspose_tex.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5.0",
    "tomli>=2.0; python_version < '3.11'",
]
mcp = [
    "mcp>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aspose_tex = ["data/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.pydocstyle]
convention = "google"
